<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f0f4f0">
  <title>Reelfile · Media downloader</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Reelfile</header>
    <section class="sheet" aria-labelledby="heading">
      <div class="intro">
        <h1 id="heading">Media downloader</h1>
        <p>Save a public video or extract its audio.</p>
      </div>
      <form id="media-form">
        <label for="url">Media link</label>
        <input id="url" name="url" type="url" inputmode="url" placeholder="https://…" required aria-describedby="sources youtube-note" autocomplete="off">
        <div class="link-help"><small id="sources">YouTube, Vimeo, Wikimedia Commons, or Blender</small><button id="sample" type="button">Try a sample</button></div>
        <small id="youtube-note" hidden>YouTube may block downloads from this server, even for public videos.</small>
        <fieldset>
          <legend>Save as</legend>
          <div class="formats">
            <label class="choice"><input type="radio" name="format" value="mp4" checked><span><b>MP4</b><small>Video</small></span></label>
            <label class="choice"><input type="radio" name="format" value="mp3"><span><b>MP3</b><small>Audio</small></span></label>
          </div>
        </fieldset>
        <button id="submit" type="submit">Prepare download</button>
      </form>
      <section id="result" class="result" hidden aria-label="Download status">
        <p id="status" role="status" aria-live="polite"></p>
        <span id="details"></span>
        <a id="save" class="save" hidden download>Save file</a>
      </section>
    </section>
    <footer>Powered by yt-dlp</footer>
  </main>
</body>
</html>
